<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kael</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080c10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: monospace;
    overflow: hidden;
    user-select: none;
  }

  #face {
    display: flex;
    gap: 48px;
    align-items: center;
    justify-content: center;
    height: 120px;
  }

  .eye {
    width: 90px;
    height: 90px;
    border-radius: 22px;
    background: #00aaff;
    box-shadow:
      0 0 18px #00aaff,
      0 0 40px rgba(0, 170, 255, 0.4);
    animation: breathe 3s ease-in-out infinite;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; box-shadow: 0 0 18px #00aaff, 0 0 40px rgba(0, 170, 255, 0.4); }
    50%       { opacity: 1;    box-shadow: 0 0 28px #00aaff, 0 0 60px rgba(0, 170, 255, 0.6); }
  }

  /* DRFT state: single scanning bar */
  #face.drft {
    gap: 0;
  }

  #face.drft .eye {
    width: 160px;
    height: 10px;
    border-radius: 5px;
    animation: scan 2.5s ease-in-out infinite;
    box-shadow: 0 0 10px #00aaff, 0 0 24px rgba(0, 170, 255, 0.3);
  }

  #face.drft .eye:nth-child(2) {
    display: none;
  }

  @keyframes scan {
    0%   { opacity: 0.2; transform: scaleX(0.4); }
    50%  { opacity: 0.7; transform: scaleX(1); }
    100% { opacity: 0.2; transform: scaleX(0.4); }
  }

  /* State label */
  #state-label {
    margin-top: 48px;
    color: rgba(0, 170, 255, 0.35);
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: opacity 0.4s;
  }

  /* Toggle button — subtle, bottom of screen */
  #toggle {
    position: fixed;
    bottom: 32px;
    background: rgba(0, 170, 255, 0.08);
    border: 1px solid rgba(0, 170, 255, 0.2);
    color: rgba(0, 170, 255, 0.5);
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  #toggle:hover {
    background: rgba(0, 170, 255, 0.15);
    color: rgba(0, 170, 255, 0.9);
    border-color: rgba(0, 170, 255, 0.5);
  }

  #toggle:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>

<div id="face">
  <div class="eye"></div>
  <div class="eye"></div>
</div>

<div id="state-label">ACTIVE</div>

<button id="toggle" onclick="swap()">swap state</button>

<script>
  let state = 'active';

  function swap() {
    const face = document.getElementById('face');
    const label = document.getElementById('state-label');

    if (state === 'active') {
      state = 'drft';
      face.classList.add('drft');
      label.textContent = 'DRFT';
    } else {
      state = 'active';
      face.classList.remove('drft');
      label.textContent = 'ACTIVE';
    }
  }

  // Also swap on spacebar
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); swap(); }
  });
</script>

</body>
</html>
