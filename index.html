<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kael</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080c10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #face {
    display: flex;
    gap: 48px;
    align-items: center;
    justify-content: center;
    height: 120px;
  }

  .eye {
    width: 90px;
    height: 90px;
    border-radius: 22px;
    background: #00aaff;
    box-shadow: 0 0 18px #00aaff, 0 0 40px rgba(0,170,255,0.4);
    animation: breathe 3s ease-in-out infinite;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; box-shadow: 0 0 18px #00aaff, 0 0 40px rgba(0,170,255,0.4); }
    50%       { opacity: 1;    box-shadow: 0 0 28px #00aaff, 0 0 60px rgba(0,170,255,0.6); }
  }

  #face.drft { gap: 0; }

  #face.drft .eye {
    width: 160px;
    height: 10px;
    border-radius: 5px;
    animation: scan 2.5s ease-in-out infinite;
    box-shadow: 0 0 10px #00aaff, 0 0 24px rgba(0,170,255,0.3);
  }

  #face.drft .eye:nth-child(2) { display: none; }

  @keyframes scan {
    0%   { opacity: 0.2; transform: scaleX(0.4); }
    50%  { opacity: 0.7; transform: scaleX(1); }
    100% { opacity: 0.2; transform: scaleX(0.4); }
  }

  #state-label {
    margin-top: 48px;
    color: rgba(0,170,255,0.25);
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="face">
  <div class="eye"></div>
  <div class="eye"></div>
</div>
<div id="state-label">—</div>

<script>
  const face = document.getElementById('face');
  const label = document.getElementById('state-label');
  let current = null;

  function applyState(s) {
    if (s === current) return;
    current = s;
    if (s === 'drft') {
      face.classList.add('drft');
      label.textContent = 'DRFT';
    } else {
      face.classList.remove('drft');
      label.textContent = 'ACTIVE';
    }
  }

  function poll() {
    fetch('http://192.168.0.249:8765/state', { cache: 'no-store' })
      .then(r => r.json())
      .then(d => applyState(d.state || 'active'))
      .catch(() => applyState('drft')); // server off = DRFT
  }

  poll();
  setInterval(poll, 5000);
</script>

</body>
</html>
